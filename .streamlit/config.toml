[theme]
base = "light"
primaryColor = "#211A4A"
backgroundColor = "#F5F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
borderColor = "#E4E7F2"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#E4E7F2"
dataframeHeaderBackgroundColor = "#F5F7FC"
chartCategoricalColors = ["#211A4A", "#7C3AED", "#8B5CF6", "#22D3EE", "#2563EB", "#059669", "#D97706"]

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 10
maxMessageSize = 20

[client]
showErrorDetails = "none"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FC"
textColor = "#111827"
borderColor = "#E4E7F2"
