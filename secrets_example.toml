# ============================================================================
# This is a TEMPLATE. Do not commit a filled-in version of this to GitHub.
# The real values go into Streamlit Cloud: App settings -> Secrets -> paste
# (Streamlit Cloud stores this encrypted; it is separate from your repo files.)
# ============================================================================

# --- Your free Postgres database (see README "Step 1" for how to get this
# --- one connection string from Supabase — no separate sheet, no Google
# --- Cloud Console, nothing else to configure). The app creates all its own
# --- tables automatically the first time it runs.
[postgres]
connection_string = "postgresql://postgres:YOUR-PASSWORD@YOUR-PROJECT.supabase.co:5432/postgres"

# --- Login cookie settings (just makes "stay logged in" work) ---
[cookie]
name = "tangoops_auth_cookie"
key = "change_this_to_any_random_string_you_like"
expiry_days = 30

# --- The ONE platform-admin account that lives in secrets. This is the
# --- top-level login: it creates businesses (ABC, DEF, ...) and each
# --- business's first owner login, but never sees any business's own
# --- broadcaster data directly. Every other login on the platform — every
# --- business owner, every sub-agency — gets created from inside the app
# --- itself. Nobody else ever needs to touch this file.
[bootstrap_admin]
username = "admin@yourcompany.com"
name = "Platform Admin"
password = "choose-a-strong-password"
